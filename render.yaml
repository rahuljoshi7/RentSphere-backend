services:
  # ── Backend: Spring Boot via Docker ───────────────────────────────────────
  - type: web
    name: rentsphere-api
    runtime: docker                   # ← KEY CHANGE: was "java", now "docker"
    plan: free
    dockerfilePath: ./Dockerfile      # path relative to repo root (where Dockerfile lives)
    healthCheckPath: /actuator/health
    envVars:
      # ── Database (auto-filled from Render PostgreSQL) ──
      - key: DATABASE_URL
        fromDatabase:
          name: rentsphere-db
          property: connectionString

      - key: DB_USERNAME
        fromDatabase:
          name: rentsphere-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: rentsphere-db
          property: password

      # ── JWT ──
      - key: JWT_SECRET
        generateValue: true

      # ── Cloudinary ──
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Mail ──
      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM
        value: noreply@rentsphere.com

      # ── CORS — update this once your frontend is deployed ──
      - key: CORS_ALLOWED_ORIGINS
        value: https://rentsphere.onrender.com,http://localhost:5173

# ── PostgreSQL (already created — this just links it) ─────────────────────
databases:
  - name: rentsphere-db
    plan: free
    databaseName: rentsphere
    user: rentsphere_user
