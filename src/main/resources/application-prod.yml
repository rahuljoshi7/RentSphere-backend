spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Render provides DATABASE_URL in postgres:// format
    # Spring needs jdbc:postgresql:// format — handled by the url rewrite below
    url: ${JDBC_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RentSpherePool
      maximum-pool-size: 5      # Free tier limit
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update          # update is safer than validate for first deploy
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy@gmail.com}
    password: ${MAIL_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${PORT:9090}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy-cloud}
    api-key: ${CLOUDINARY_API_KEY:dummy-key}
    api-secret: ${CLOUDINARY_API_SECRET:dummy-secret}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rentsphere.onrender.com}

  mail:
    from: ${MAIL_FROM:noreply@rentsphere.com}
    from-name: RentSphere

  pagination:
    default-page-size: 10
    max-page-size: 100

  scheduler:
    rent-reminder-cron: "0 0 9 1 * ?"
    overdue-check-cron: "0 0 0 * * ?"
    agreement-expiry-cron: "0 0 8 * * ?"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always      # needed for Render health check to pass

logging:
  level:
    root: WARN
    com.rentsphere: INFO
